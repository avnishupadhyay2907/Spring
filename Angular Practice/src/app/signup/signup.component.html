<div align="center">

    <h1>Sign Up</h1>
    <h3 style="color: red;" *ngIf="form.errorMsg">{{form.errorMsg}}</h3>
    <h3 style="color: green;" *ngIf="form.successMsg">{{form.successMsg}}</h3>
    <form (submit)="signUp()">
        <table align="center">

            <tr>
                <th>First Name</th>
                <td><input type="text" name="firstName" [(ngModel)]="form.data.firstName" placeholder="Enter your first name"></td>

                <td style="color: red;">{{form.inputError.firstName}}</td>
            </tr>
            <tr>
                <th>Last Name</th>
                <td><input type="text" name="lastName" [(ngModel)]="form.data.lastName" placeholder="Enter your last name">
                </td>
                <td style="color: red;">{{form.inputError.lastName}}</td>
            </tr>
            <tr>
                <th>Login</th>
                <td><input type="text" name="login" [(ngModel)]="form.data.login" placeholder="Enter your login"></td>
                <td style="color: red;">{{form.inputError.login}}
            </tr>
            <tr>
                <th>Password</th>
                <td><input type="password" name="password" [(ngModel)]="form.data.password" placeholder="Enter your password"></td>
                <td style="color: red;">{{form.inputError.password}}</td>
            </tr>

            <tr>
                <th></th>
                <td><input type="submit" value="signup"></td>
            </tr>


        </table>
    </form>

</div>
