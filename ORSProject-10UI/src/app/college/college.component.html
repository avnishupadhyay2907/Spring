<div align="center">
    <h1 style="color: blue;">Add College</h1>
    <h3 style="margin: 0; color: green;" *ngIf="!form.error && form.message">{{ form.message }}</h3>
    <h3 style="margin: 0; color: red;" *ngIf="form.error && form.message">{{ form.message }}</h3>

    <form>
        <table align="center">

            <tr>
                <th align="left">Name<span style="color: red">*</span></th>
                <td><input type="text" name="name" [(ngModel)]="form.data.name" placeholder="Enter College Name"></td>
                <td style="position: fixed; color: red;">{{form.inputerror.name}}</td>
            </tr>

            <tr>
                <th align="left">Address<span style="color: red">*</span></th>
                <td><input type="text" name="address" [(ngModel)]="form.data.address" placeholder="Enter College Address"></td>
                <td style="position: fixed; color: red;">{{form.inputerror.address}}</td>
            </tr>

            <tr>
                <th align="left">State<span style="color: red">*</span></th>
                <td><input type="text" name="state" [(ngModel)]="form.data.state" placeholder="Enter College State">
                </td>
                <td style="position: fixed; color: red;">{{form.inputerror.state}}</td>
            </tr>

            <tr>
                <th align="left">City<span style="color: red">*</span></th>
                <td><input type="text" name="city" [(ngModel)]="form.data.city" placeholder="Enter College city"></td>
                <td style="position: fixed; color: red;">{{form.inputerror.city}}</td>
            </tr>
            <tr>
                <th align="left">Phone No<span style="color: red">*</span></th>
                <td><input type="text" name="phone_no" [(ngModel)]="form.data.phone_no" placeholder="Enter College Phone No"></td>
                <td style="position: fixed; color: red;">{{form.inputerror.phone_no}}</td>
            </tr>

            <tr>
                <th></th>
                <td align="left" colspan="2">
                    <button (click)="submit()">save</button>
                </td>
            </tr>
        </table>

    </form>

</div>
