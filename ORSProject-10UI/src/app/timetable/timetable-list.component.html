<div align="center">
    <h1 align="center" style="margin-bottom: 5px; color: red;">TimeTable List</h1>

    <div style="height: 20px; margin-bottom: 10px; text-align: center;">
        <h3 style="margin: 0; color: green;" *ngIf="!form.error && form.message">{{ form.message }}</h3>
        <h3 style="margin: 0; color: red;" *ngIf="form.error && form.message">{{ form.message }}</h3>
    </div>

    <div *ngIf="form.list.length > 0">
        <table style="width: 100%">
            <tr>
                <td align="center">
                    <label><b>Semester: </b></label>
                    <input type="text" name="semester" [(ngModel)]="form.searchParams.semester" placeholder="Enter TimeTable Semester">&nbsp;

                    <label><b>Course: </b></label>
                    <select name="courseId" [(ngModel)]="form.searchParams.courseId" style="width: 165px;">
                        <option value="undefined">------------Select------------</option>
                        <option *ngFor="let obj of form.preload.courseList" [value]="obj.key">{{obj.value}}</option>
                    </select>&nbsp;

                    <label><b>Subject: </b></label>
                    <select name="subjectId" [(ngModel)]="form.searchParams.subjectId" style="width: 165px;">
                        <option value="undefined">------------Select------------</option>
                        <option *ngFor="let obj of form.preload.subjectList" [value]="obj.key">{{obj.value}}</option>
                    </select>&nbsp;

                    <button (click)="search()">search</button>&nbsp;
                    <button (click)="reset()">reset</button>
                </td>
            </tr>
        </table>

        <br>

        <table border="1" style="width: 100%; border: groove;">
            <tr style="background-color: #e1e6f1e3;">
                <th><input type="checkbox" [(ngModel)]="isMasterSel" (change)="checkUncheckAll($event)" /></th>
                <th>S.No</th>
                <th>Semester</th>
                <th>Description</th>
                <th>Exam Date</th>
                <th>Exam Time</th>
                <th>Course</th>
                <th>Subject</th>
                <th>Edit</th>
            </tr>

            <tr align="center" *ngFor="let m of form.list; let i = index">
                <td><input type="checkbox" #checkboxes (change)="checklistUpdate()" [id]="m.id" [value]="isMasterSel">
                </td>
                <td>{{(form.pageNo*5)+i+ 1}}</td>
                <td>{{m.semester}}</td>
                <td>{{m.description}}</td>
                <td>{{m.examDate | date : 'dd-MM-yyyy'}}</td>
                <td>{{m.examTime}}</td>
                <td>{{m.courseName}}</td>
                <td>{{m.subjectName}}</td>
                <td><a (click)="forward( '/timetable/' +  m.id)" style="cursor: pointer;">Edit</a></td>
            </tr>
        </table>

        <br>

        <table style="width: 100%">
            <tr>
                <td style="width: 25%"><button (click)="previous()" [disabled]="form.pageNo == 0">previous</button></td>
                <td align="center" style="width: 25%"><button (click)="forward('/timetable')">new</button></td>
                <td align="center" style="width: 25%"><button (click)="deleteMany()">delete</button></td>
                <td style="width: 25%" align="right"><button (click)="next()" [disabled]="form.nextListSize == 0">next</button></td>
            </tr>
        </table>
    </div>

    <br>

    <div *ngIf="form.list.length == 0"><button (click)="reset()">Back</button></div>
</div>
